version: '3.8'

services:
  roseflix:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TMDB_API_KEY: 2829a1add433f561ebd50469df695228
        NEXT_PUBLIC_SITE_NAME: RoseFlix
        NEXT_PUBLIC_SITE_URL: http://localhost:3001
        NEXT_PUBLIC_PRIMARY_COLOR: "#FF1E56"
        NEXT_PUBLIC_PRIMARY_NICHE: movies
        NEXT_PUBLIC_ENABLE_ADS: "true"
        NEXT_PUBLIC_AD_PHASE: clean
        NEXT_PUBLIC_POPUNDER_COOLDOWN_MINUTES: "30"
        NEXT_PUBLIC_DIRECT_LINK_URL: https://asiafilm.org/4/287bf0d63aeec5a2ec61f86a8bf8e1bd
    container_name: roseflix_app
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
    ports:
      - "3001:3000"
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

